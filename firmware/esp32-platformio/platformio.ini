; PlatformIO Project Configuration File
; CityMart Cold Storage Environment Node (WH-006)
; 1 ESP32 + 1 OLED SSD1306 + 1 SHT30 Sensor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Tự động dò cổng COM (COM7 hoặc COM9) khi cắm USB CH340
; Hoặc mở comment bên dưới nếu bạn muốn khóa cố định 1 cổng:
; upload_port = COM9
; monitor_port = COM9
; upload_port = COM7
; monitor_port = COM7

; Tự động cài đặt toàn bộ thư viện cần thiết khi build
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.4
