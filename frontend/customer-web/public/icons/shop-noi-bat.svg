<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#b45309" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background soft triangle badge -->
  <path d="M 50 10 L 88 78 A 8 8 0 0 1 80 88 L 20 88 A 8 8 0 0 1 12 78 Z" fill="#DCFCE7" opacity="0.6" />
  <!-- Medal Outer Ring -->
  <circle cx="50" cy="50" r="32" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="26" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="50" cy="50" r="23" fill="url(#goldGrad)"/>
  <!-- 5-pointed Star in center -->
  <polygon points="50,34 54,44 65,44 56,51 60,61 50,54 40,61 44,51 35,44 46,44" fill="#FFFFFF"/>
</svg>

