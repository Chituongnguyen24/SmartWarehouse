# Cấu hình Nginx Reverse Proxy cho Hệ thống SmartWarehouse (C.T Mart) trên AWS EC2
# Phục vụ: Web Dashboard (SPA), Customer Web (Next.js SSR), và 9 Backend Microservices

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate Limiting Zones (OWASP DoS & Brute-force Mitigation)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name smartwarehouse-kltn.duckdns.org;

    server_tokens off;
    client_max_body_size 50M;

    # Security Headers (OWASP Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cấu hình chung cho CORS
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    proxy_hide_header 'Access-Control-Expose-Headers';

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-ID' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-Correlation-ID' always;

    # ═══════════════════════════════════════════
    # 1. Customer Web (Next.js SSR - Port 3000)
    # ═══════════════════════════════════════════
    # Next.js Static Chunks, CSS, and JS Assets (Directly from disk with proxy fallback)
    location /_next/static/ {
        alias /home/ubuntu/SmartWarehouse/frontend/customer-web/.next/static/;
        expires 365d;
        access_log off;
    }

    # Next.js Dynamic Assets (SSR, Chunks, Image Optimization)
    location /_next/ {
        proxy_pass http://127.0.0.1:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Customer Web Static Folders (Images, Banners, Icons, Logos, Brands, Payments, Social, Certs, App Stores)
    location ~* ^/(banners|banner_tt|brands|icons|click-and-cook|logos|social|payments|certs|app-store|backgroud_card|products)/ {
        root /home/ubuntu/SmartWarehouse/frontend/customer-web/public;
        try_files $uri @customer_proxy;
        expires 30d;
        access_log off;
    }

    # Customer Web Categories images (avoid conflict with /categories backend API)
    location ~ ^/categories/.+\.(png|jpg|jpeg|webp|svg|gif|ico)$ {
        root /home/ubuntu/SmartWarehouse/frontend/customer-web/public;
        try_files $uri @customer_proxy;
        expires 30d;
        access_log off;
    }

    location @customer_proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Store entrypoint (supports both /store and /store/)
    location = /store {
        return 301 /store/;
    }

    location /store/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Customer Web Navigation Routes (Cart, Product Details, Category, Auth, Checkout, Info)
    location ~ ^/(gio-hang|san-pham|danh-muc|tat-ca-danh-muc|khuyen-mai|flash-sale|ban-chay|tim-kiem|thanh-toan|don-hang|dang-nhap|dang-ky|tai-khoan|ve-chung-toi|he-thong-sieu-thi|tuyen-dung|tin-tuc|hd-mua-hang|chinh-sach-giao-hang|chinh-sach-doi-tra|chinh-sach-bao-mat)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══════════════════════════════════════════
    # 2. Socket.IO & Realtime WebSocket Gateway (Port 3004)
    # ═══════════════════════════════════════════
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3004/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ═══════════════════════════════════════════
    # 3. 9 Backend Microservices APIs (Ports 3004 - 3013)
    # Hỗ trợ cả request có hoặc không có dấu gạch chéo cuối (trailing slash)
    # ═══════════════════════════════════════════
    location /auth {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /products {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /categories {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vouchers {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reports {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /inventory {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lots {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /orders {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /warehouses {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /outbound-orders {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /inbound-orders {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /transport {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══════════════════════════════════════════
    # IoT Gateway & Pick-to-Light Service (Port 3002)
    # ═══════════════════════════════════════════
    location /api/iot/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(shelf|climate|sensor)/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══════════════════════════════════════════
    # 4. Gateway Health Check
    # ═══════════════════════════════════════════
    location /health {
        return 200 '{"status":"UP","gateway":"Nginx EC2 Gateway","timestamp":$msec}';
        add_header Content-Type application/json;
    }

    # ═══════════════════════════════════════════
    # 5. Staff App (Mobile / Web SPA)
    # ═══════════════════════════════════════════
    location = /staff {
        return 301 /staff/;
    }

    location /staff/ {
        alias /home/ubuntu/SmartWarehouse/frontend/staff-app/dist/;
        try_files $uri $uri/ /staff/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ═══════════════════════════════════════════
    # 6. Web Dashboard (Single Page App - React Vite)
    # Đặt tại thư mục build dist của web-dashboard
    # ═══════════════════════════════════════════
    root /home/ubuntu/SmartWarehouse/frontend/web-dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
