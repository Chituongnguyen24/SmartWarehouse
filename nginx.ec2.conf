# Cấu hình Nginx Reverse Proxy cho Hệ thống SmartWarehouse (C.T Mart) trên AWS EC2
# Đặt tại: /etc/nginx/sites-available/sfwms.conf (hoặc /etc/nginx/conf.d/sfwms.conf)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _; # Hoặc điền Domain / Elastic IP của EC2 (VD: api.sfwms.vn)

    client_max_body_size 50M;

    # Cấu hình chung cho CORS (Hỗ trợ cả Web Dashboard, Staff App, Driver App)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-ID' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-Correlation-ID' always;

    # ═══════════════════════════════════════════
    # 1. Socket.IO & Realtime WebSocket Gateway (Port 3004)
    # ═══════════════════════════════════════════
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3004/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ═══════════════════════════════════════════
    # 2. User & Authentication Service (Port 3012)
    # ═══════════════════════════════════════════
    location /auth/ {
        proxy_pass http://127.0.0.1:3012/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /users/ {
        proxy_pass http://127.0.0.1:3012/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 3. Product Service (Port 3010)
    # ═══════════════════════════════════════════
    location /products/ {
        proxy_pass http://127.0.0.1:3010/products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /categories/ {
        proxy_pass http://127.0.0.1:3010/categories/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 4. Inventory Service (Port 3011)
    # ═══════════════════════════════════════════
    location /inventory/ {
        proxy_pass http://127.0.0.1:3011/inventory/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /lots/ {
        proxy_pass http://127.0.0.1:3011/lots/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 5. Order Service (Port 3004)
    # ═══════════════════════════════════════════
    location /orders/ {
        proxy_pass http://127.0.0.1:3004/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 6. Warehouse Service (Port 3005)
    # ═══════════════════════════════════════════
    location /warehouses/ {
        proxy_pass http://127.0.0.1:3005/warehouses/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 7. Outbound Service (Port 3007)
    # ═══════════════════════════════════════════
    location /outbound-orders/ {
        proxy_pass http://127.0.0.1:3007/outbound-orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 8. Inbound Service (Port 3006)
    # ═══════════════════════════════════════════
    location /inbound-orders/ {
        proxy_pass http://127.0.0.1:3006/inbound-orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 9. Transport Service (Port 3013)
    # ═══════════════════════════════════════════
    location /transport/ {
        proxy_pass http://127.0.0.1:3013/transport/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════
    # 10. Health Check Endpoint
    # ═══════════════════════════════════════════
    location /health {
        return 200 '{"status":"UP","gateway":"Nginx EC2 Gateway","timestamp":$msec}';
        add_header Content-Type application/json;
    }
}

